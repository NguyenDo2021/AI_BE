spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://ep-twilight-pine-aokb1te0.c-2.ap-southeast-1.aws.neon.tech:5432/quan_ly_kho?sslmode=require}
    username: ${DATABASE_USERNAME:neondb_owner}
    password: ${DATABASE_PASSWORD:npg_eMgN9c3rqlOh}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 0

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://he-thong-ban-hang.vercel.app,http://localhost:5173,http://127.0.0.1:5173}

  seed:
    enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
